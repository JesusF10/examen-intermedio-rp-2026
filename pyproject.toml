[project]
name = "examen-intermedio-rp-2026"
version = "0.1.0"
description = "Examen de Reconocimiento de Patrones"
authors = [{ name = "Jesus Flores Lacarra" }]
requires-python = ">=3.14.9,<3.15"
dependencies = []

[dependency-groups]
dev = ["ruff", "ty"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["problema-1/src", "problema-2/src"]
